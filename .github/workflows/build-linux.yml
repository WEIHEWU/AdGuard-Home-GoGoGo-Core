name: Build Android ARM64 Slim Core

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'development' }}
  DIST_DIR: dist
  GOPROXY: https://proxy.golang.org,https://goproxy.cn,direct

jobs:
  build-android-slim:
    name: Vet, Verify Config & Build Android ARM64 (v8.2)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Vet all build profiles (Android Pure DNS, Android SNI, Standard)
        run: make go-os-check

      - name: Build host amd64 slim binary & verify AdGuardHome.yaml compatibility
        run: |
          #!/bin/sh
          set -e -f -u

          GOOS=linux GOARCH=amd64 OUT=/tmp/AdGuardHome_amd64 \
            sh ./scripts/make/go-build-android.sh

          mkdir -p /tmp/agh-conf-check
          cp ./doc/AdGuardHome.yaml.example /tmp/agh-conf-check/AdGuardHome.yaml
          /tmp/AdGuardHome_amd64 --check-config -w /tmp/agh-conf-check

      - name: Build Android ARM64 (GOARM64=v8.2) static slim binary
        id: build
        run: |
          #!/bin/sh
          set -e -f -u

          source_date_epoch="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH="${source_date_epoch}"

          app_version="$(env CHANNEL="${CHANNEL}" sh ./scripts/make/version.sh)"
          echo "APP_VERSION=${app_version}" >> "$GITHUB_ENV"

          case "${app_version}" in
          v[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9])
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
            ;;
          *)
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
            ;;
          esac

          mkdir -p "${DIST_DIR}/AdGuardHome"
          VERSION="${app_version}" OUT="${DIST_DIR}/AdGuardHome/AdGuardHome" \
            sh ./scripts/make/go-build-android.sh

          tar -C "${DIST_DIR}" -czf "${DIST_DIR}/AdGuardHome_linux_arm64.tar.gz" AdGuardHome
          (
            cd "${DIST_DIR}"
            sha256sum AdGuardHome/AdGuardHome AdGuardHome_linux_arm64.tar.gz > checksums.txt
            cat checksums.txt
          )

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AdGuard-Home-GoGoGo-Core-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/AdGuardHome/AdGuardHome
            dist/AdGuardHome_linux_arm64.tar.gz
            dist/checksums.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AdGuardHome_linux_arm64.tar.gz
            dist/checksums.txt
          generate_release_notes: true
          make_latest: ${{ env.PRERELEASE == 'true' && 'false' || 'true' }}
          name: AdGuard-Home-GoGoGo Core ${{ env.APP_VERSION }}
          prerelease: ${{ env.PRERELEASE == 'true' }}
          body: |
            专为 [AdGuard-Home-GoGoGo](https://github.com/WEIHEWU/AdGuard-Home-GoGoGo) Android Root 模块深度裁剪构建的满血 DNS + NFQUEUE SNI 防火墙核心（`linux/arm64`, `GOARM64=v8.2`, `CGO_ENABLED=0`）。

            - **编译档位**：`-tags="android_slim"`（完整支持 NFQUEUE SNI 监听与 TLS ClientHello 阻断，同时保留零前端体积、零磁盘数据库写入、零后台轮询唤醒）
            - **完全兼容**：100% 兼容 `AdGuardHome.yaml` (`schema_version: 34`) 与 [AdGuard-Home-GoGoGo Manager](https://github.com/WEIHEWU/AdGuard-Home-GoGoGo-Manager) `/control/*` 控制接口。
